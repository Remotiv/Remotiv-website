# =============================================================================
# Persona config — default conversational assistant
# =============================================================================
# To create a new persona: copy this file, change system_prompt / knowledge /
# voice / avatar. Point --persona-config at it. Nothing else changes.

name: "Default Assistant"

system_prompt: |
  You are a helpful, conversational AI assistant.
  Keep your answers clear and concise. Speak naturally.

# Appended after system_prompt (formatting instructions for TTS-friendly output).
# Set to "" to disable.
output_instructions: |
  IMPORTANT: Keep your answers conversational and concise (3-5 sentences).
  No markdown, no bullet points, no numbered lists. Speak naturally as if in conversation.
  When the user sends audio, answer the question in the audio. Respond in plain text only.

# Injected after audio/text input, before model turn. Usually empty.
post_input_prompt: ""

# Knowledge sources to load into context.
# strategy: prefix_cache (stuffed into system prompt, KV-cached)
#           rag           (chunked + embedded, retrieved per query — future)
knowledge: []
  # - path: "corpora/fifa_2010_2022.txt"
  #   strategy: prefix_cache

# TTS voice settings
tts:
  voice: "af_heart"
  lang: "a"
  speed: 1.0

# Avatar settings (for RTR integration — future)
avatar:
  reference_image: null
